<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Scientific Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>

    <div class="calculator">

        <h1>🧮 Scientific Calculator</h1>

        <input type="text" id="display" placeholder="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="delete" onclick="deleteLast()">⌫</button>
            <button class="function" onclick="calculate('Math.sqrt(')">√</button>
            <button class="operator" onclick="calculate('/')">÷</button>

            <button onclick="calculate('7')">7</button>
            <button onclick="calculate('8')">8</button>
            <button onclick="calculate('9')">9</button>
            <button class="operator" onclick="calculate('*')">×</button>

            <button onclick="calculate('4')">4</button>
            <button onclick="calculate('5')">5</button>
            <button onclick="calculate('6')">6</button>
            <button class="operator" onclick="calculate('-')">−</button>

            <button onclick="calculate('1')">1</button>
            <button onclick="calculate('2')">2</button>
            <button onclick="calculate('3')">3</button>
            <button class="operator" onclick="calculate('+')">+</button>

            <button onclick="calculate('0')">0</button>
            <button onclick="calculate('.')">.</button>
            <button class="function" onclick="calculate('Math.sin(')">sin</button>
            <button class="function" onclick="calculate('Math.cos(')">cos</button>

            <button class="function" onclick="calculate('Math.tan(')">tan</button>
            <button class="function" onclick="calculate('Math.log10(')">log</button>
            <button class="function" onclick="calculate('Math.log(')">ln</button>
            <button class="function" onclick="calculate('Math.pow(')">xʸ</button>

            <button class="special" onclick="calculate('Math.PI')">π</button>
            <button class="special" onclick="calculate('Math.E')">e</button>
            <button class="special" onclick="calculate('(')">(</button>
            <button class="special" onclick="calculate(')')">)</button>

            <button class="equal" onclick="calculateResult()">=</button>

        </div>

    </div>

    <script src="calculator.js"></script>

</body>
</html>
